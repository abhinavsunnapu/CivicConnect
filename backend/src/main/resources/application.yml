spring:
  application:
    name: civicconnect-backend
  # Optional local file with DB_URL / DB_USERNAME / DB_PASSWORD (git-ignored). See .env.example.
  config:
    import: optional:file:.env[.properties]
  jackson:
    default-property-inclusion: non_null

  # PostgreSQL connection: supplied through environment variables, never hard-coded.
  # DB_USERNAME and DB_PASSWORD have no defaults; if they are missing, startup fails when
  # Flyway tries to connect (Flyway runs before the web server starts).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civicconnect}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: civicconnect-pool
      maximum-pool-size: 10

  # Flyway owns the schema. Hibernate only checks that entities match it.
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

# Application-specific settings (bound to com.civicconnect.config.AppProperties)
civicconnect:
  name: CivicConnect
  version: '@project.version@'
  allowed-origins:
    - http://localhost:5173

# Actuator: expose only health and info, without internal details
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: CivicConnect
    version: '@project.version@'

logging:
  level:
    root: INFO
    com.civicconnect: INFO
